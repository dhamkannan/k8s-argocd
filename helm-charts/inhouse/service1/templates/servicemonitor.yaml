{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "service-core.fullname" . }}
  labels:
    {{- include "service-core.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "service-core.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
{{- end }}
