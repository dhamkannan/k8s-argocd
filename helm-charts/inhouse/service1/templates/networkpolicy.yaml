{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service-core.fullname" . }}
  labels:
    {{- include "service-core.labels" . | nindent 4 }}
    {{- if .Values.global.labels }}
      {{- toYaml .Values.global.labels | nindent 4 }}
    {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "service-core.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}