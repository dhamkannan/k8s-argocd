# Default values for ambassador.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Manually set metadata for the Release.
#
# Defaults to .Chart.Name
nameOverride: 'service1'
# Defaults to .Release.Name-.Chart.Name
fullnameOverride: 'service1'

chartnameOverride: ''


env: ""

global:
  labels:
    # application: mp2

configs:
  READINESS_DELAY_SEC: "5"
  FAIL_RATE: "0.1"

secrets:
  GREETING: "Hello"

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # annotations:

service:
  type: ClusterIP
  ports:
    http:
      port: 80
      containerPort:  8000

networkPolicy:
  enabled: false
  # ingress:
  #   - from:
  #       - namespaceSelector:
  #           matchLabels:
  #             name: other-namespace
  #       - podSelector:
  #           matchLabels:
  #             app: allowed-app
  # egress:
  #   - to:
  #       - namespaceSelector:
  #           matchLabels:
  #             name: other-namespace
  #     - podSelector:
  #         matchLabels:
  #           app: allowed-app

image:
  repository: kaikoapp
  tag: v2
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilization: 70
  targetMemoryUtilization: 80

podDisruptionBudget:
  create: true
  maxUnavailable: '25%'

serviceMonitor:
  enabled: false

deployment:
  replicaCount: 1

  nodeAffinity:
    enabled: false
    nodeGroups:
    - dev
  
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true

  containerSecurityContext:
    privileged: false  
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    # seccompProfile:
    #   type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: "25%"
      maxUnavailable: "25%"
  
  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /healthz
      port: '{{ include "service-core.defaultport" . }}'
      scheme: HTTP
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 1

  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /readyz
      port: '{{ include "service-core.defaultport" . }}'
      scheme: HTTP
    periodSeconds: 5
    successThreshold: 1 # Must be 1
    timeoutSeconds: 1
  
  startupProbe:
    failureThreshold: 12
    httpGet:
      path: /readyz
      port: '{{ include "service-core.defaultport" . }}'
      scheme: HTTP
    periodSeconds: 5
    successThreshold: 1 # Must be 1
    timeoutSeconds: 1
  
  resources:	
    limits:	
      cpu: 1	
      memory: 1Gi	
    requests:	
      cpu: 10m	
      memory: 64Mi


  #startupProbe

  #env:

  #tolerations
  
  #resources

  #volumeMounts

  #volumes

  #extraContainers

