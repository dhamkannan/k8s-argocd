apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: default
spec:
  destination:
    namespace: default
    server: 'https://kubernetes.default.svc'
  source:
    path: helm-charts/opensource/argocd
    repoURL: https://github.com/dhamkannan/k8s-argocd.git
    targetRevision: v1
  project: default